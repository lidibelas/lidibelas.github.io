# ============================================
# Workflow: Atualizar cache do Lattes
# ============================================
#
# Este workflow NÃO faz scraping automático do Lattes.
# O Lattes exige reCAPTCHA e não tem API pública.
#
# O que este workflow FAZ:
# - Verifica se data/lattes_cache.json foi atualizado
# - Valida que não está vazio (nunca publica vazio)
# - Se válido, mantém; se vazio, falha sem apagar
#
# Como atualizar os dados do Lattes:
# 1. Localmente, rode: python3 scripts/lattes_export.py
#    (ou exporte o XML do Lattes e rode: python3 scripts/lattes_export.py arquivo.xml)
# 2. Revise data/lattes_cache.json
# 3. Faça commit e push
# 4. O site usa o cache automaticamente
#
# Para rodar manualmente no GitHub Actions:
# - Vá em Actions > "Update Lattes Cache" > "Run workflow"
# ============================================

name: Update Lattes Cache

on:
  workflow_dispatch:  # só executa manualmente
  push:
    paths:
      - 'data/lattes_cache.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Lattes cache
        run: |
          if [ ! -f data/lattes_cache.json ]; then
            echo "ℹ Cache do Lattes não existe. Use scripts/lattes_export.py para gerar."
            exit 0
          fi

          # Verificar se o JSON é válido
          if ! python3 -c "import json; json.load(open('data/lattes_cache.json'))" 2>/dev/null; then
            echo "✗ Cache inválido (JSON corrompido). Preservando versão anterior."
            exit 1
          fi

          # Verificar se não está vazio
          EMPTY=$(python3 -c "
          import json
          data = json.load(open('data/lattes_cache.json'))
          has_content = any(data.get(k) for k in ['education', 'projects', 'publications', 'trajectory'])
          print('false' if has_content else 'true')
          ")

          if [ "$EMPTY" = "true" ]; then
            echo "✗ Cache vazio detectado. NÃO publicando resultado vazio."
            exit 1
          fi

          echo "✓ Cache do Lattes válido e não-vazio."

      - name: Show cache info
        run: |
          if [ -f data/lattes_cache.json ]; then
            python3 -c "
          import json
          data = json.load(open('data/lattes_cache.json'))
          meta = data.get('_meta', {})
          print(f\"  Exportado em: {meta.get('exported_at', 'desconhecido')}\")
          print(f\"  Lattes ID: {meta.get('lattes_id', 'desconhecido')}\")
          print(f\"  Formação: {len(data.get('education', []))} entradas\")
          print(f\"  Trajetória: {len(data.get('trajectory', []))} entradas\")
          print(f\"  Projetos: {len(data.get('projects', []))} entradas\")
          print(f\"  Publicações: {len(data.get('publications', []))} entradas\")
          "
          fi